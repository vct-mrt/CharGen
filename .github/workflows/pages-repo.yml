name: Publish apt/dnf repositories to Pages

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y createrepo-c dpkg-dev apt-utils gnupg rpm

      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pool_deb pool_rpm
          for tag in $(gh release list --limit 500 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -D "dl/$tag" -p '*.deb' -p '*.rpm' --clobber || true
          done
          find dl -name '*.deb' -exec cp -f {} pool_deb/ \; 2>/dev/null || true
          find dl -name '*.rpm' -exec cp -f {} pool_rpm/ \; 2>/dev/null || true
          echo "debs: $(ls pool_deb | wc -l), rpms: $(ls pool_rpm | wc -l)"

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"
          mkdir -p site/apt site/rpm
          gpg --armor --export "$KEYID" > site/apt/KEY.asc
          gpg --export "$KEYID" > site/apt/KEY.gpg
          gpg --armor --export "$KEYID" > site/rpm/KEY.gpg

      - name: Build APT repository
        run: |
          mkdir -p site/apt/pool/main
          cp -f pool_deb/*.deb site/apt/pool/main/ 2>/dev/null || true
          cd site/apt
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages --arch amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=CharGen \
            -o APT::FTPArchive::Release::Label=CharGen \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$GPG_KEYID" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$GPG_KEYID" -abs -o dists/stable/Release.gpg dists/stable/Release
          cd ../..

      - name: Build DNF repository
        run: |
          cp -f pool_rpm/*.rpm site/rpm/ 2>/dev/null || true
          cat > "$HOME/.rpmmacros" <<RPMMACROS
          %_signature gpg
          %_gpg_name $GPG_KEYID
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-armor --pinentry-mode loopback --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}
          RPMMACROS
          # NOTE: rpm --addsign parses each .rpm while the key is loaded; full parse/sign
          # separation of untrusted packages is a tracked follow-up (see SECURITY_AUDIT.md GHA-1).
          for f in site/rpm/*.rpm; do rpm --addsign "$f" || true; done
          createrepo_c site/rpm
          gpg --batch --yes --pinentry-mode loopback --default-key "$GPG_KEYID" --detach-sign --armor site/rpm/repodata/repomd.xml
          cat > site/rpm/chargen.repo <<'REPO'
          [chargen]
          name=CharGen
          baseurl=https://vct-mrt.github.io/CharGen/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://vct-mrt.github.io/CharGen/rpm/KEY.gpg
          REPO

      - name: Write landing page
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>CharGen package repositories</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
              h1 { border-bottom: 2px solid #eee; padding-bottom: .3rem; }
              h2 { margin-top: 2rem; }
              pre { background: #1e1e1e; color: #eee; padding: 1rem; border-radius: 6px; overflow-x: auto; }
              code { font-family: ui-monospace, monospace; }
              footer { margin-top: 3rem; color: #888; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>CharGen package repositories</h1>
            <p>Self-hosted, GPG-signed apt and dnf repositories for the CharGen command-line utility.</p>

            <h2>Fedora / RHEL (dnf)</h2>
            <pre><code>sudo dnf config-manager --add-repo https://vct-mrt.github.io/CharGen/rpm/chargen.repo
          sudo dnf install chargen</code></pre>

            <h2>Debian / Ubuntu (apt)</h2>
            <pre><code>curl -fsSL https://vct-mrt.github.io/CharGen/apt/KEY.gpg | sudo tee /etc/apt/keyrings/chargen.gpg >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/chargen.gpg] https://vct-mrt.github.io/CharGen/apt stable main' | sudo tee /etc/apt/sources.list.d/chargen.list
          sudo apt update &amp;&amp; sudo apt install chargen</code></pre>

            <footer>Repositories are rebuilt and republished automatically on every new release.</footer>
          </body>
          </html>
          HTML

      - name: Wipe GPG key material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ] && [ -d "$GNUPGHOME" ]; then
            gpgconf --kill all 2>/dev/null || true
            rm -rf "$GNUPGHOME"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
