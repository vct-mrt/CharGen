name: Snap

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  snap:
    runs-on: ubuntu-latest
    env:
      SNAP_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags required for `git describe` in snapcraft override-pull
      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: chargen-snap
          path: ${{ steps.build.outputs.snap }}
      # Publishes only when the store credentials secret is configured, so the
      # workflow does not fail on tags before the Snap Store setup is done.
      - name: Publish to Snap Store (stable)
        if: startsWith(github.ref, 'refs/tags/v') && env.SNAP_CREDS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
